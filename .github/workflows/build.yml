name: Build check

# Lightweight "does it still compile" verification on every push/PR. This is
# NOT the release pipeline -- see release.yml (manual, Actions tab) for the
# actual packaged builds players download. Keeping this one fast and free of
# packaging steps means it stays useful as a quick regression signal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds only read the repository.
permissions:
  contents: read

env:
  LLVM_VERSION: "20.1.8"

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher patches and saved settings
        run: python3 tools/bench/launcher_patch_check.py
      - name: Install clang-20 + build deps
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libgtk-3-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev
      - name: Configure + build (SDK + game, unified via REXSDK_DIR)
        working-directory: simpsons
        run: |
          cmake --preset linux-amd64-relwithdebinfo \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/tools/rexglue-sdk" \
            -DSDL_DBUS=ON \
            -DREXGLUE_ENABLE_LTO=ON \
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3"
          cmake --build --preset linux-amd64-relwithdebinfo --target simpsons

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher patches and saved settings
        run: python tools/bench/launcher_patch_check.py
      - name: Install LLVM/Clang ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\llvm.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm.exe" -ArgumentList '/S' -Wait
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - name: Configure + build (SDK + game, unified via REXSDK_DIR)
        shell: pwsh
        working-directory: simpsons
        run: |
          cmake --preset win-amd64-relwithdebinfo `
            -DREXSDK_DIR="$env:GITHUB_WORKSPACE/tools/rexglue-sdk" `
            -DREXGLUE_USE_D3D11=ON `
            -DREXGLUE_ENABLE_LTO=ON `
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3"
          cmake --build --preset win-amd64-relwithdebinfo --target simpsons
